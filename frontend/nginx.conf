# ===========================================================================
# Audit-grade access logging (see docs/architecture/logging-system.md)
# ---------------------------------------------------------------------------
# Everything down to the `log_format` below is http-level. It is legal here:
# Dockerfile.prod COPYs this file to /etc/nginx/conf.d/default.conf, and the
# stock nginx.conf's `include conf.d/*.conf` sits INSIDE the http block (the
# pre-existing limit_req_zone line is an http-level directive too).
# ===========================================================================

# --- 1. API key redaction -------------------------------------------------
# The API key is the ONLY door lock in front of /api/* (the Cloudflare Access
# policy for /api/* is a Bypass), so it must never reach disk. Measured before
# this change: 4 hours of the default `combined` access log held 69 lines
# containing the full plaintext key, all of them from the SSE endpoint, which
# used to accept `?api_key=` because the browser EventSource API cannot set
# request headers.
#
# Auth P3 removed that query parameter (SSE now authenticates by session
# cookie), so nothing should produce such a URL any more. This map STAYS
# regardless: it is what makes "the key never lands in an archive" true rather
# than merely intended, and it costs one regex per request.
#
# Until now that was protected only by accident — every ./deploy.sh rebuilds
# the web container, and Docker's json-file log is keyed by container ID, so
# the log was silently wiped ~22 times in the last 30 days. Persisting the
# access log (below) removes that accident, so redaction becomes mandatory:
# otherwise we would be writing the key permanently to disk AND into every
# logrotate archive.
#
# NEVER log $request or a bare $args in this file — $request carries the full
# query string and would leak the key straight back.
map $args $args_redacted {
    default                                $args;
    "~^(?<a>.*)\bapi_key=[^&]*(?<b>.*)$"   "${a}api_key=REDACTED${b}";
}

# --- 2. Real client IP recovery ------------------------------------------
# Path: browser -> Cloudflare Edge (writes XFF / CF-Connecting-IP / CF-Ray)
#       -> Cloudflare Tunnel -> cloudflared (host systemd, adds NOTHING)
#       -> http://10.6.20.138:3000 -> docker-proxy SNAT -> nginx sees 172.x
# So without real_ip every external request logs as the Docker gateway.
#
# Why X-Forwarded-For and not CF-Connecting-IP: XFF is measured to exist on
# this path today; CF-Connecting-IP cannot be confirmed without changing
# config first. The kcm_audit log records cf_ip alongside, so once
# CF-Connecting-IP is confirmed present we can switch over painlessly.
#
# Why real_ip_recursive stays OFF (the default): nginx then takes the
# RIGHTMOST value of XFF. Cloudflare APPENDS the true client IP to whatever
# XFF the client sent, so a forged value lands on the left and is ignored.
# Measured today's chain length is 1 (`218.253.255.122`, no comma) because
# normal browsers send no XFF at all.
#
# Why 172.16.0.0/12 and not the current literal 172.25.0.1: this compose file
# has no `networks:` section, so the subnet is auto-allocated by Docker and
# can drift when the network is recreated. A pinned address would make
# real_ip SILENTLY stop working. Widening to the whole Docker private range
# is safe here: the only other members are api/mkdocs/redis, none of which
# ever originate requests to nginx.
#
# Colleagues hitting http://10.6.20.138:3000 directly arrive via iptables
# DNAT with their source IP preserved (12 distinct real 10.6.20.x addresses
# were observed in a sibling container's logs). 10.6.20.0/24 is deliberately
# NOT trusted here, so nginx leaves $remote_addr as their real LAN IP and
# they cannot spoof XFF. No extra if/map needed.
#
# Cloudflare's own edge ranges must NEVER be added: the Tunnel is an OUTBOUND
# connection, so a Cloudflare IP is never the TCP peer nginx sees.
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Forwarded-For;
# real_ip_recursive intentionally left at its default (off) — see above.
#
# real_ip alone is NOT enough. Every proxy block below therefore forwards
#     proxy_set_header X-Forwarded-For $remote_addr;   (overwrite)
# instead of the old
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   (append)
# because the backend reads the XFF *header*, not $remote_addr, and all five
# readers take element [0] of the list:
#   app/core/api_key_middleware.py, app/core/trace_middleware.py,
#   app/api/v1/routes/client_log.py, .../client_return_rate.py, .../login_ip.py
# With the appending form, `curl -H "X-Forwarded-For: 1.2.3.4"` landed as
# `client=1.2.3.4` in backend.log — measured, not theoretical. Overwriting with
# the real_ip-recovered $remote_addr closes that.

# --- 3. JSON access log format -------------------------------------------
# escape=json is mandatory: raw quotes in User-Agent/Referer would otherwise
# break the JSON structure. Numeric fields ($status, $request_length,
# $body_bytes_sent, $request_time) are unquoted; $upstream_status and
# $upstream_response_time MUST stay quoted because on an upstream retry nginx
# emits a comma-separated list ("502, 200") which is not a JSON number.
# trace_id comes from the backend's trace_middleware.py, which sets the
# X-Trace-ID response header — it joins these lines to backend.log.
log_format kcm_audit escape=json
    '{'
      '"ts":"$time_iso8601"'
      ',"client_ip":"$remote_addr"'
      ',"xff":"$http_x_forwarded_for"'
      ',"cf_ip":"$http_cf_connecting_ip"'
      ',"cf_ray":"$http_cf_ray"'
      ',"cf_country":"$http_cf_ipcountry"'
      ',"cf_user":"$http_cf_access_authenticated_user_email"'
      ',"host":"$host"'
      ',"method":"$request_method"'
      ',"uri":"$uri"'
      ',"args":"$args_redacted"'
      ',"proto":"$server_protocol"'
      ',"status":$status'
      ',"upstream_status":"$upstream_status"'
      ',"req_len":$request_length'
      ',"body_bytes":$body_bytes_sent'
      ',"req_time":$request_time'
      ',"upstream_time":"$upstream_response_time"'
      ',"upstream_addr":"$upstream_addr"'
      ',"trace_id":"$upstream_http_x_trace_id"'
      ',"limit_req":"$limit_req_status"'
      ',"referer":"$http_referer"'
      ',"ua":"$http_user_agent"'
    '}';

# Rate limiting zone: 60 requests/sec per IP for API endpoints
# burst=120 allows short spikes; nodelay processes burst immediately
# Dashboard fires 5+ concurrent widget requests; NAT-shared office IPs share this bucket.
#
# $binary_remote_addr needs NO change for the real_ip work above: ngx_http_realip
# rewrites $remote_addr in the POST_READ phase, while limit_req evaluates its key
# in the later PREACCESS phase — so the zone automatically keys on the recovered
# client IP. Note the direction of that change is a LOOSENING only: previously
# every Cloudflare-routed request shared one bucket keyed on the Docker gateway
# address; now each real client gets its own bucket. Nobody is throttled harder
# than before.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
    listen 80;
    server_name localhost;

    # Persisted audit log. Bind-mounted from ./logs/nginx-prod on the host
    # (docker-compose.prod.yml), so it survives the container rebuild that
    # ./deploy.sh performs — the previous json-file log was keyed by container
    # ID and therefore had a history horizon of roughly one day.
    #
    # ONLY /var/log/nginx-audit is mounted. Do NOT mount over /var/log/nginx:
    # that directory holds the error.log -> /dev/stderr symlink, and a mount
    # would replace it with a real file. Nginx errors would then vanish from
    # `docker logs`, which /opt/myproject/morning-digest/digest.py scans.
    access_log /var/log/nginx-audit/access.log kcm_audit;
    # error_log stays at the default /var/log/nginx/error.log -> /dev/stderr.

    # Enable gzip compression (reduces transfer size over Cloudflare tunnel)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # index.html must never be cached: it carries the references to hashed
    # /assets/*.js chunks. After ./deploy.sh, old chunk hashes are gone, so any
    # client (browser tab, CF edge) holding a stale index.html ends up requesting
    # 404 chunks → ChunkLoadError → LazyErrorBoundary "失联" page.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # 1. Frontend Static Files (SPA fallback also rewrites to /index.html above)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Vite build output includes content hash in filenames (e.g. index-abc123.js)
    # so they can be cached for a long time safely.
    # try_files falls back to @assets_archive: after a deploy the new image no
    # longer ships the previous build's chunk hashes, but tabs still holding
    # the old index.html keep requesting them on lazy navigation. deploy.sh
    # archives the last 3 builds' assets on the host (scripts/
    # archive-frontend-assets.sh) and bind-mounts them read-only at
    # /opt/assets-archive/assets — serving those keeps old tabs working
    # without lazyWithRetry's forced full-page reload.
    location /assets {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @assets_archive;
    }

    # Old-build chunks preserved across deploys. Same immutable caching:
    # content-hashed names never change meaning. Missing here too → plain 404,
    # and lazyWithRetry remains the last-resort recovery (tab older than the
    # retention window, or archive volume absent).
    location @assets_archive {
        root /opt/assets-archive;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2a. SSE endpoint (OPT-0013): browser EventSource cannot set custom
    # headers. Exact-match (=) wins over the prefix-match /api block below
    # regardless of order in this file.
    #
    # AUTH P3 — no API key check here, deliberately. EventSource can send
    # neither a header nor (any longer) a `?api_key=` query param, so there is
    # no credential this location could check that the browser is able to
    # present. What EventSource DOES send is the same-origin session cookie, so
    # identity is enforced one layer in, by the backend's AuthMiddleware, which
    # 401s an anonymous caller. That is a stronger check than the key ever was:
    # the key is compiled into the public JS bundle, so anyone who can load the
    # page already holds it.
    #
    # Consequence to be aware of when using the kill switch: with
    # AUTH_ENABLED=false this endpoint is open to anyone who can reach the
    # domain. That is the pre-P3 posture (the "lock" was a key everyone had),
    # and it is the price of a rollback that leaves live alerts working. Do not
    # "fix" it by requiring a cookie here — that breaks exactly the rollback the
    # kill switch exists for.
    #
    # Also disable proxy buffering so events stream in real time instead
    # of being held until the buffer fills.
    location = /api/v1/risk-monitor/alerts/stream {
        limit_req zone=api_limit burst=120 nodelay;
        limit_req_status 429;

        # SSE-specific: stream events without buffering, long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2d. AUTH P3 — the two OIDC endpoints reached by BROWSER NAVIGATION.
    #
    #   /api/v1/auth/login     the user clicks "Sign in with Microsoft"
    #   /api/v1/auth/callback  login.microsoftonline.com redirects back here
    #
    # Neither can carry X-API-Key: a top-level navigation sets no custom
    # headers, and the callback is issued by Microsoft, which has never heard of
    # our key. Without these two exact-match blocks the `location /api` gate
    # below returns 403 and login is impossible — the failure looks like
    # "Microsoft works, then our site says Forbidden", with nothing in
    # backend.log because the request never reached the backend.
    #
    # Leaving them unauthenticated at the edge is correct: /login only mints a
    # random state and redirects to Microsoft, and /callback is useless without
    # a valid authorization code AND the matching PKCE verifier from a state row
    # that only we issued and that is deleted on first use. Rate limited, since
    # both are reachable by anyone.
    location = /api/v1/auth/login {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/v1/auth/callback {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The token exchange is a round trip to login.microsoftonline.com from
        # the backend, so allow more than a local handler would need.
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2c. OPT-0026: internal docs portal. MkDocs Material live-serves on
    # mkdocs:8000 inside the compose network. mkdocs.yml's site_url =
    # /docs/ makes mkdocs expect requests already carrying the /docs/
    # prefix — so proxy_pass *without* a trailing slash preserves the
    # full URI when forwarding (otherwise the upstream 302s "/" back to
    # "/docs/" and we hit a redirect loop through Nginx).
    location /docs/ {
        # The portal has no authentication of its own — it is a plain proxy to
        # the mkdocs container — so until auth P3.5 the ONLY thing keeping ~150
        # internal documents (runbooks, architecture, DB schemas, the auth
        # design doc) off the public internet was the Cloudflare Access
        # application wrapping the whole hostname. Now that the app has its own
        # login, that CF application is being removed, and this subrequest is
        # what replaces it. Do not delete one without the other.
        # ⚠ As of auth P4b the subrequest asks `?require=manager`, so the docs
        # portal is manager-only. Its sidebar entry is still shown to everyone
        # (greyed out) — that is cosmetic, anyone can type the URL, and THIS is
        # the enforcement.
        auth_request /internal/auth-verify;

        # The two denials mean different things and must land in different
        # places. Getting this wrong is an infinite loop, not a cosmetic issue.
        #
        # 401 — no session at all. The login page is the fix.
        error_page 401 = @docs_login;
        # 403 — signed in, but not a manager. Sending THESE to the login page
        # would loop forever: sign in, come back, 403, bounce to login, sign in.
        # They get a page that explains instead.
        #
        # 403 used to point at @docs_login, and for a good reason that has to
        # survive this change: the subrequest below presents the API key baked
        # into this image at build time (nginx.conf is COPY+sed'd in
        # Dockerfile.prod), so a key rotation without a `web` rebuild also
        # produces a 403 here. Bouncing to login made that recognisable
        # ("it keeps asking me to log in" beats a blank Forbidden). Now that a
        # role check produces 403 too, the two causes share a status code and
        # the redirect is no longer safe — so @docs_forbidden names the stale
        # key explicitly instead. The diagnostic moved, it was not dropped.
        error_page 403 = @docs_forbidden;

        proxy_pass http://mkdocs:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Session probe for the block above. `internal` means it is reachable only
    # from a subrequest, never from the network.
    #
    # The API key is injected here rather than added to the backend's exemption
    # list: this is our own nginx talking to our own backend, so it can present
    # the credential a browser navigation cannot, and /api/v1/auth/verify stays
    # behind the same key gate as everything else.
    location = /internal/auth-verify {
        internal;
        # ?require=manager (auth P4b) — 204 manager, 403 signed-in non-manager,
        # 401 nobody. The value is whitelisted server-side (_VERIFY_REQUIREMENTS
        # in routes/auth.py); an unrecognised one answers 400, which nginx turns
        # into a 500 rather than into an accidental allow.
        # A proxy_pass with its own query string replaces the request's, which
        # is what we want: this is a subrequest for /docs/*, its args are the
        # reader's (mkdocs search terms), and none of them belong here.
        proxy_pass http://api:8001/api/v1/auth/verify?require=manager;
        # A GET probe needs no body, and forwarding one would make nginx buffer
        # the original request twice.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-API-Key "__BACKEND_API_KEY__";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Anonymous docs visitor -> our login page, and back to the page they asked
    # for once they are in. $uri (path only, no query string) because an
    # unescaped `?q=...` from the mkdocs search page would otherwise split the
    # return_to parameter in half; sanitize_return_to() rejects anything odd
    # that still gets through, and the worst case is landing on /docs/.
    location @docs_login {
        # absolute_redirect off is load-bearing: by default nginx expands a
        # "/path" redirect into "$scheme://$host/path", and $scheme here is
        # http — the tunnel terminates TLS at Cloudflare and speaks plaintext to
        # this origin. An https visitor would be sent to an http URL and have to
        # be rescued by an edge upgrade. A relative Location has no scheme to
        # get wrong, and every browser has accepted one since RFC 7231.
        absolute_redirect off;
        return 302 /login?return_to=$uri;
    }

    # Signed-in docs visitor who is not a manager. A terminal page, NOT a
    # redirect: the reader already has a valid session, so every place we could
    # send them would send them straight back here.
    #
    # Static and self-contained on purpose — it has to render when the reader
    # has no access to the thing that would normally explain it, and it must not
    # depend on the API it sits in front of. Bilingual because the diagnostic
    # line is aimed at two different readers: the colleague who needs to know
    # who to ask, and whoever is on call when a stale API key makes the whole
    # portal answer 403 to actual managers.
    location @docs_forbidden {
        default_type text/html;
        charset utf-8;
        return 403 '<!doctype html><meta charset="utf-8"><title>Docs - manager access required</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2328;background:#f6f8fa;margin:0;padding:48px 20px}main{max-width:640px;margin:0 auto;background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:32px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;font-weight:600;margin:0 0 20px;color:#57606a}p{margin:0 0 12px}.zh{color:#57606a}hr{border:0;border-top:1px solid #d0d7de;margin:24px 0}.note{font-size:14px;color:#57606a}a{color:#0969da}</style><main><h1>Documentation is manager-only</h1><h2 class="zh">文档站仅管理员可访问</h2><p>You are signed in, but the internal documentation portal is restricted to managers. Ask a manager to grant you the manager role on the <a href="/cfg/managers">Managers</a> page, or ask them for the specific document you need.</p><p class="zh">你已登录，但内部文档站仅对管理员开放。请联系管理员在「Managers」页面给你 manager 角色，或直接向管理员索取你需要的文档。</p><p><a href="/">&larr; Back to the app / 返回应用</a></p><hr><p class="note">If you ARE a manager and still see this page, the web image is probably carrying a stale API key after a rotation - rebuild and redeploy the <code>web</code> image.</p><p class="note zh">如果你本身就是 manager 却仍看到这个页面，多半是 API key 轮换后 web 镜像没有重新构建（镜像里的 key 是旧的）- 请重新 build 并部署 <code>web</code> 镜像。</p></main>';
    }

    # 2b. Backend API Proxy (with rate limiting after Cloudflare Access bypass)
    location /api {
        limit_req zone=api_limit burst=120 nodelay;
        limit_req_status 429;

        # Reject requests without valid API Key (defense-in-depth with backend middleware)
        # __BACKEND_API_KEY__ substituted at image build — see note on the SSE block above.
        if ($http_x_api_key != "__BACKEND_API_KEY__") {
            return 403;
        }

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
    }
}

