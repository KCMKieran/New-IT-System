# ===========================================================================
# Audit-grade access logging (see docs/architecture/logging-system.md)
# ---------------------------------------------------------------------------
# Everything down to the `log_format` below is http-level. It is legal here:
# Dockerfile.prod COPYs this file to /etc/nginx/conf.d/default.conf, and the
# stock nginx.conf's `include conf.d/*.conf` sits INSIDE the http block (the
# pre-existing limit_req_zone line is an http-level directive too).
# ===========================================================================

# --- 1. API key redaction -------------------------------------------------
# The SSE endpoint (/api/v1/risk-monitor/alerts/stream) accepts the API key as
# a ?api_key= query parameter because the browser EventSource API cannot set
# request headers. That key is the ONLY door lock in front of /api/* (the
# Cloudflare Access policy for /api/* is a Bypass), so it must never reach
# disk. Measured before this change: 4 hours of the default `combined` access
# log held 69 lines containing the full plaintext key.
#
# Until now that was protected only by accident — every ./deploy.sh rebuilds
# the web container, and Docker's json-file log is keyed by container ID, so
# the log was silently wiped ~22 times in the last 30 days. Persisting the
# access log (below) removes that accident, so redaction becomes mandatory:
# otherwise we would be writing the key permanently to disk AND into every
# logrotate archive.
#
# NEVER log $request or a bare $args in this file — $request carries the full
# query string and would leak the key straight back.
map $args $args_redacted {
    default                                $args;
    "~^(?<a>.*)\bapi_key=[^&]*(?<b>.*)$"   "${a}api_key=REDACTED${b}";
}

# --- 2. Real client IP recovery ------------------------------------------
# Path: browser -> Cloudflare Edge (writes XFF / CF-Connecting-IP / CF-Ray)
#       -> Cloudflare Tunnel -> cloudflared (host systemd, adds NOTHING)
#       -> http://10.6.20.138:3000 -> docker-proxy SNAT -> nginx sees 172.x
# So without real_ip every external request logs as the Docker gateway.
#
# Why X-Forwarded-For and not CF-Connecting-IP: XFF is measured to exist on
# this path today; CF-Connecting-IP cannot be confirmed without changing
# config first. The kcm_audit log records cf_ip alongside, so once
# CF-Connecting-IP is confirmed present we can switch over painlessly.
#
# Why real_ip_recursive stays OFF (the default): nginx then takes the
# RIGHTMOST value of XFF. Cloudflare APPENDS the true client IP to whatever
# XFF the client sent, so a forged value lands on the left and is ignored.
# Measured today's chain length is 1 (`218.253.255.122`, no comma) because
# normal browsers send no XFF at all.
#
# Why 172.16.0.0/12 and not the current literal 172.25.0.1: this compose file
# has no `networks:` section, so the subnet is auto-allocated by Docker and
# can drift when the network is recreated. A pinned address would make
# real_ip SILENTLY stop working. Widening to the whole Docker private range
# is safe here: the only other members are api/mkdocs/redis, none of which
# ever originate requests to nginx.
#
# Colleagues hitting http://10.6.20.138:3000 directly arrive via iptables
# DNAT with their source IP preserved (12 distinct real 10.6.20.x addresses
# were observed in a sibling container's logs). 10.6.20.0/24 is deliberately
# NOT trusted here, so nginx leaves $remote_addr as their real LAN IP and
# they cannot spoof XFF. No extra if/map needed.
#
# Cloudflare's own edge ranges must NEVER be added: the Tunnel is an OUTBOUND
# connection, so a Cloudflare IP is never the TCP peer nginx sees.
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Forwarded-For;
# real_ip_recursive intentionally left at its default (off) — see above.
#
# real_ip alone is NOT enough. Every proxy block below therefore forwards
#     proxy_set_header X-Forwarded-For $remote_addr;   (overwrite)
# instead of the old
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   (append)
# because the backend reads the XFF *header*, not $remote_addr, and all five
# readers take element [0] of the list:
#   app/core/api_key_middleware.py, app/core/trace_middleware.py,
#   app/api/v1/routes/client_log.py, .../client_return_rate.py, .../login_ip.py
# With the appending form, `curl -H "X-Forwarded-For: 1.2.3.4"` landed as
# `client=1.2.3.4` in backend.log — measured, not theoretical. Overwriting with
# the real_ip-recovered $remote_addr closes that.

# --- 3. JSON access log format -------------------------------------------
# escape=json is mandatory: raw quotes in User-Agent/Referer would otherwise
# break the JSON structure. Numeric fields ($status, $request_length,
# $body_bytes_sent, $request_time) are unquoted; $upstream_status and
# $upstream_response_time MUST stay quoted because on an upstream retry nginx
# emits a comma-separated list ("502, 200") which is not a JSON number.
# trace_id comes from the backend's trace_middleware.py, which sets the
# X-Trace-ID response header — it joins these lines to backend.log.
log_format kcm_audit escape=json
    '{'
      '"ts":"$time_iso8601"'
      ',"client_ip":"$remote_addr"'
      ',"xff":"$http_x_forwarded_for"'
      ',"cf_ip":"$http_cf_connecting_ip"'
      ',"cf_ray":"$http_cf_ray"'
      ',"cf_country":"$http_cf_ipcountry"'
      ',"cf_user":"$http_cf_access_authenticated_user_email"'
      ',"host":"$host"'
      ',"method":"$request_method"'
      ',"uri":"$uri"'
      ',"args":"$args_redacted"'
      ',"proto":"$server_protocol"'
      ',"status":$status'
      ',"upstream_status":"$upstream_status"'
      ',"req_len":$request_length'
      ',"body_bytes":$body_bytes_sent'
      ',"req_time":$request_time'
      ',"upstream_time":"$upstream_response_time"'
      ',"upstream_addr":"$upstream_addr"'
      ',"trace_id":"$upstream_http_x_trace_id"'
      ',"limit_req":"$limit_req_status"'
      ',"referer":"$http_referer"'
      ',"ua":"$http_user_agent"'
    '}';

# Rate limiting zone: 60 requests/sec per IP for API endpoints
# burst=120 allows short spikes; nodelay processes burst immediately
# Dashboard fires 5+ concurrent widget requests; NAT-shared office IPs share this bucket.
#
# $binary_remote_addr needs NO change for the real_ip work above: ngx_http_realip
# rewrites $remote_addr in the POST_READ phase, while limit_req evaluates its key
# in the later PREACCESS phase — so the zone automatically keys on the recovered
# client IP. Note the direction of that change is a LOOSENING only: previously
# every Cloudflare-routed request shared one bucket keyed on the Docker gateway
# address; now each real client gets its own bucket. Nobody is throttled harder
# than before.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
    listen 80;
    server_name localhost;

    # Persisted audit log. Bind-mounted from ./logs/nginx-prod on the host
    # (docker-compose.prod.yml), so it survives the container rebuild that
    # ./deploy.sh performs — the previous json-file log was keyed by container
    # ID and therefore had a history horizon of roughly one day.
    #
    # ONLY /var/log/nginx-audit is mounted. Do NOT mount over /var/log/nginx:
    # that directory holds the error.log -> /dev/stderr symlink, and a mount
    # would replace it with a real file. Nginx errors would then vanish from
    # `docker logs`, which /opt/myproject/morning-digest/digest.py scans.
    access_log /var/log/nginx-audit/access.log kcm_audit;
    # error_log stays at the default /var/log/nginx/error.log -> /dev/stderr.

    # Enable gzip compression (reduces transfer size over Cloudflare tunnel)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # index.html must never be cached: it carries the references to hashed
    # /assets/*.js chunks. After ./deploy.sh, old chunk hashes are gone, so any
    # client (browser tab, CF edge) holding a stale index.html ends up requesting
    # 404 chunks → ChunkLoadError → LazyErrorBoundary "失联" page.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # 1. Frontend Static Files (SPA fallback also rewrites to /index.html above)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Vite build output includes content hash in filenames (e.g. index-abc123.js)
    # so they can be cached for a long time safely.
    # try_files falls back to @assets_archive: after a deploy the new image no
    # longer ships the previous build's chunk hashes, but tabs still holding
    # the old index.html keep requesting them on lazy navigation. deploy.sh
    # archives the last 3 builds' assets on the host (scripts/
    # archive-frontend-assets.sh) and bind-mounts them read-only at
    # /opt/assets-archive/assets — serving those keeps old tabs working
    # without lazyWithRetry's forced full-page reload.
    location /assets {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @assets_archive;
    }

    # Old-build chunks preserved across deploys. Same immutable caching:
    # content-hashed names never change meaning. Missing here too → plain 404,
    # and lazyWithRetry remains the last-resort recovery (tab older than the
    # retention window, or archive volume absent).
    location @assets_archive {
        root /opt/assets-archive;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2a. SSE endpoint (OPT-0013): browser EventSource cannot set custom
    # headers, so we accept the API key as either X-API-Key header OR
    # ?api_key= query string. Exact-match (=) wins over the prefix-match
    # /api block below regardless of order in this file.
    # Also disable proxy buffering so events stream in real time instead
    # of being held until the buffer fills.
    location = /api/v1/risk-monitor/alerts/stream {
        limit_req zone=api_limit burst=120 nodelay;
        limit_req_status 429;

        # Header-or-query auth check (defense-in-depth with backend middleware
        # which has the same fallback on this path).
        set $auth_key $http_x_api_key;
        if ($auth_key = "") { set $auth_key $arg_api_key; }
        # NOTE: __BACKEND_API_KEY__ is a build-time placeholder. frontend/Dockerfile.prod
        # substitutes the real key (from the API_KEY build arg) at image build, so the
        # secret never lives in source control. Rotate via docker-compose build arg.
        if ($auth_key != "__BACKEND_API_KEY__") {
            return 403;
        }

        # SSE-specific: stream events without buffering, long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2c. OPT-0026: internal docs portal. MkDocs Material live-serves on
    # mkdocs:8000 inside the compose network. mkdocs.yml's site_url =
    # /docs/ makes mkdocs expect requests already carrying the /docs/
    # prefix — so proxy_pass *without* a trailing slash preserves the
    # full URI when forwarding (otherwise the upstream 302s "/" back to
    # "/docs/" and we hit a redirect loop through Nginx).
    location /docs/ {
        proxy_pass http://mkdocs:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 2b. Backend API Proxy (with rate limiting after Cloudflare Access bypass)
    location /api {
        limit_req zone=api_limit burst=120 nodelay;
        limit_req_status 429;

        # Reject requests without valid API Key (defense-in-depth with backend middleware)
        # __BACKEND_API_KEY__ substituted at image build — see note on the SSE block above.
        if ($http_x_api_key != "__BACKEND_API_KEY__") {
            return 403;
        }

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append — see the real_ip note at the top of this file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
    }
}

