# Rate limiting zone: 60 requests/sec per IP for API endpoints
# burst=120 allows short spikes; nodelay processes burst immediately
# Dashboard fires 5+ concurrent widget requests; NAT-shared office IPs share this bucket.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
    listen 80;
    server_name localhost;

    # Enable gzip compression (reduces transfer size over Cloudflare tunnel)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # index.html must never be cached: it carries the references to hashed
    # /assets/*.js chunks. After ./deploy.sh, old chunk hashes are gone, so any
    # client (browser tab, CF edge) holding a stale index.html ends up requesting
    # 404 chunks → ChunkLoadError → LazyErrorBoundary "失联" page.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # 1. Frontend Static Files (SPA fallback also rewrites to /index.html above)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Vite build output includes content hash in filenames (e.g. index-abc123.js)
    # so they can be cached for a long time safely
    location /assets {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2a. SSE endpoint (OPT-0013): browser EventSource cannot set custom
    # headers, so we accept the API key as either X-API-Key header OR
    # ?api_key= query string. Exact-match (=) wins over the prefix-match
    # /api block below regardless of order in this file.
    # Also disable proxy buffering so events stream in real time instead
    # of being held until the buffer fills.
    location = /api/v1/risk-monitor/alerts/stream {
        limit_req zone=api_limit burst=120 nodelay;
        limit_req_status 429;

        # Header-or-query auth check (defense-in-depth with backend middleware
        # which has the same fallback on this path).
        set $auth_key $http_x_api_key;
        if ($auth_key = "") { set $auth_key $arg_api_key; }
        if ($auth_key != "779815c95a60166188bd7ff95551fb4b866e91dac445fd117695d962b8f25165") {
            return 403;
        }

        # SSE-specific: stream events without buffering, long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2b. Backend API Proxy (with rate limiting after Cloudflare Access bypass)
    location /api {
        limit_req zone=api_limit burst=120 nodelay;
        limit_req_status 429;

        # Reject requests without valid API Key (defense-in-depth with backend middleware)
        if ($http_x_api_key != "779815c95a60166188bd7ff95551fb4b866e91dac445fd117695d962b8f25165") {
            return 403;
        }

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
    }
}

