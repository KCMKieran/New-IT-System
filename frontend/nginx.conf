# Rate limiting zone: 30 requests/sec per IP for API endpoints
# burst=50 allows short spikes; nodelay processes burst immediately
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name localhost;

    # Enable gzip compression (reduces transfer size over Cloudflare tunnel)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # 1. Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Vite build output includes content hash in filenames (e.g. index-abc123.js)
    # so they can be cached for a long time safely
    location /assets {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. Backend API Proxy (with rate limiting after Cloudflare Access bypass)
    location /api {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
    }
}

