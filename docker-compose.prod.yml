# Production deployment: Nginx (static frontend) + FastAPI + Redis
# Runs alongside dev containers without conflict
version: "3.9"

services:
  # Frontend: Nginx serves pre-built static files on port 80
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Read from the root .env file; baked into nginx.conf at build time so
        # the API key never lives in source control. Rotate the value in .env.
        API_KEY: ${API_KEY:?API_KEY must be set in .env for the prod build}
    container_name: new-it-frontend-prod
    ports:
      # Loopback-only: LAN clients must use https://analysis.kohleservices.com
      # (via CF tunnel, whose ingress targets localhost:3000). Bare-IP access
      # is intentionally refused — see auth-login-design.md §4.3.
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    environment:
      # Same wall clock as the api container, so nginx's $time_iso8601 in
      # logs/nginx-prod/access.log lines up directly with backend.log instead
      # of needing an 8-hour mental offset. nginx:alpine already ships tzdata.
      - TZ=Asia/Hong_Kong
    volumes:
      # Fallback pool of hashed assets from the previous 3 builds, maintained
      # by scripts/archive-frontend-assets.sh (invoked from deploy.sh before
      # each rebuild). Nginx serves these when a stale browser tab requests a
      # chunk hash the current build no longer ships — see the @assets_archive
      # block in frontend/nginx.conf. Read-only: the container must never
      # mutate the archive. Mounted OUTSIDE /usr/share/nginx/html so archived
      # files are only reachable through the /assets fallback, not directly.
      - ./frontend/.assets-archive/merged:/opt/assets-archive/assets:ro
      # Audit access log (kcm_audit JSON format, see frontend/nginx.conf).
      # Kept on the host so it survives the container rebuild in ./deploy.sh —
      # the Docker json-file log is keyed by container ID, which gave the old
      # access log a history horizon of about one day (22 deploys in 30 days).
      #
      # Path MUST stay outside ./frontend/: that directory is the Docker build
      # context, so logs written there would be tarred into every build and
      # bust the layer cache. frontend/.dockerignore's `*.log` uses
      # filepath.Match and only matches the context root, so it would not
      # exclude a nested logs dir either.
      #
      # Mount ONLY /var/log/nginx-audit. Mounting /var/log/nginx would destroy
      # the error.log -> /dev/stderr symlink and hide nginx errors from
      # `docker logs`, which morning-digest scans.
      - ./logs/nginx-prod:/var/log/nginx-audit
    restart: unless-stopped
    # Measured 730 KB/day today, but each permanently-open Risk Monitor tab
    # reconnects SSE every 18s and adds ~1.97 MB/day on its own. The cap is not
    # about disk pressure (781 GB free on the host) — it is that "no limit" is
    # "no policy": an error storm, an SSE reconnect loop or a scanner hammering
    # the site can add tens of GB in hours with nobody noticing.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
        compress: "true"

  # Backend: FastAPI with Uvicorn (production mode, 2 workers, no --reload)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: new-it-backend-prod
    # No host port mapping: Nginx proxies to api:8001 via Docker internal network
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis-prod
      - REDIS_PORT=6379
      # Interactive API docs (Swagger/ReDoc/openapi.json) OFF in prod. Explicit
      # rather than relying on the code default, so it can't be silently
      # re-enabled by a stray line in the shared backend/.env. Dev sets true.
      - API_DOCS_ENABLED=false
      # Container system time = HKT so log timestamps & YYYYMMDD folder names
      # match what the business sees; APScheduler explicitly uses ZoneInfo anyway.
      - TZ=Asia/Hong_Kong
      # Prod should run Login IP cron jobs; dev explicitly disables this switch.
      - LOGIN_IP_SCHEDULER_ENABLED=true
      # OPT-0006: ROACE precompute scheduler — nightly 06:00 HKT refresh of
      # backend/data/client_roace.db so the Client Return Rate page doesn't
      # join stats_balances (19M rows) on every request. Dev keeps default off.
      - CLIENT_ROACE_SCHEDULER_ENABLED=true
      # OPT-0013: enable Server-Sent Events push for the Risk Monitor page.
      # Frontend's RealtimeIndicator (small pip next to the tab list) will
      # turn green and increment its "pushed" counter once the scheduler
      # publishes events. Additive change — REST /alerts endpoint and
      # setInterval polling continue to work; SSE is a UX enhancement.
      # If SSE proves unstable through Cloudflare Tunnel: flip back to
      # false + `./deploy.sh` to revert.
      - SSE_ENABLED=true
      # OPT-0011: cursor-mode scanning. Per-(rule_type, server) HWM
      # replaces the overlap time-window SQL — MySQL no longer re-scans
      # the same rows on every tick. Cold-start row missing → 1 tick of
      # legacy SQL then upsert. Quick Profit is intentionally untouched
      # (its 30-min aggregation can't fit strict-greater-than cursor).
      - CURSOR_SCAN_ENABLED=true
      # OPT-0012: fast/slow tier split. Burst Open runs every 60s
      # (fast tier); Quick OC + Quick Profit stay on scan_interval_min
      # cadence (slow tier). Requires OPT-0011 — without cursor mode
      # the 60s polling would 10× MySQL load. Both tiers share
      # _scan_lock; collisions skip a tick (~1/10min, harmless).
      - BURST_FAST_TIER_ENABLED=true
      # Force-include allowlist: accounts here BYPASS the demo/test filter in
      # every non-Gap-Trade rule, so the risk team can validate rules with a
      # real "test"-named account without renaming it. Comma-separated
      # `{sid}-{login}` (MT4_Live=1, MT5=5, MT4_Live2=6). Restart to change.
      # ⚠ A listed account WILL show up in real alerts/stats — that's intended.
      # 5-60000017 (NAME='test-acc') = risk team's leverage-abuse validation acct.
      - RISK_MONITOR_FORCE_INCLUDE_LOGINSIDS=5-60000017
    restart: unless-stopped
    depends_on:
      - redis-prod
    volumes:
      - ./backend/logs-prod:/app/logs
      - ./backend/logs_login_ip:/app/logs_login_ip
      - ./backend/data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  redis-prod:
    image: redis:7-alpine
    container_name: new-it-redis-prod
    restart: unless-stopped
    # 256MB cap + LRU eviction so a runaway cache writer can't OOM Redis
    # (default maxmemory=0 + noeviction would silently fail new SETs).
    # See docs/optimization/items/OPT-0019-redis-maxmemory-policy.md.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Measured 3.9 KB/day, so 3 x 10m is roughly 21 years of headroom. The cap
    # exists to bound the pathological case (Redis logging an error per client
    # on OOM / eviction storms), not the steady state.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # OPT-0026: internal docs portal. MkDocs Material live-serves docs/ over
  # the shared compose network; Nginx proxies /docs/ to mkdocs:8000.
  # Read-only mounts so the container can never mutate source files.
  # Runtime ops: docs/operations/docs-portal.md
  # Image tag pinned to a concrete release so `docker compose pull` can't
  # silently break the portal on an upstream major version bump (OPT-0026
  # outsider-review F2). Bump intentionally when ready.
  mkdocs:
    image: squidfunk/mkdocs-material:9.7.6
    container_name: new-it-mkdocs-prod
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    volumes:
      - ./docs:/docs/docs:ro
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
    restart: unless-stopped
    # Probe through the /docs/ prefix that matches the site_url; a plain /
    # would just hit the 302 → /docs/ redirect and still pass, but exercising
    # the real path catches broken mkdocs.yml syntax / missing docs_dir too.
    # Use 127.0.0.1 (not "localhost") — inside this image localhost resolves
    # to ::1 (IPv6) but mkdocs serve only binds IPv4 0.0.0.0:8000, so wget
    # via localhost would get ECONNREFUSED forever.
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:8000/docs/ >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Measured 72.6 KB/day, ~95% of which is the ~145-line broken-link WARNING
    # block mkdocs prints on every rebuild. Bounded so a rebuild loop cannot
    # quietly fill the disk.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        compress: "true"
