# Production deployment: Nginx (static frontend) + FastAPI + Redis
# Runs alongside dev containers without conflict
version: "3.9"

services:
  # Frontend: Nginx serves pre-built static files on port 80
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: new-it-frontend-prod
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # Backend: FastAPI with Uvicorn (production mode, 2 workers, no --reload)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: new-it-backend-prod
    # No host port mapping: Nginx proxies to api:8001 via Docker internal network
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis-prod
      - REDIS_PORT=6379
      # Container system time = HKT so log timestamps & YYYYMMDD folder names
      # match what the business sees; APScheduler explicitly uses ZoneInfo anyway.
      - TZ=Asia/Hong_Kong
      # Prod should run Login IP cron jobs; dev explicitly disables this switch.
      - LOGIN_IP_SCHEDULER_ENABLED=true
      # OPT-0006: ROACE precompute scheduler — nightly 06:00 HKT refresh of
      # backend/data/client_roace.db so the Client Return Rate page doesn't
      # join stats_balances (19M rows) on every request. Dev keeps default off.
      - CLIENT_ROACE_SCHEDULER_ENABLED=true
      # OPT-0013: enable Server-Sent Events push for the Risk Monitor page.
      # Frontend's RealtimeIndicator (small pip next to the tab list) will
      # turn green and increment its "pushed" counter once the scheduler
      # publishes events. Additive change — REST /alerts endpoint and
      # setInterval polling continue to work; SSE is a UX enhancement.
      # If SSE proves unstable through Cloudflare Tunnel: flip back to
      # false + `./deploy.sh` to revert.
      - SSE_ENABLED=true
      # OPT-0011: cursor-mode scanning. Per-(rule_type, server) HWM
      # replaces the overlap time-window SQL — MySQL no longer re-scans
      # the same rows on every tick. Cold-start row missing → 1 tick of
      # legacy SQL then upsert. Quick Profit is intentionally untouched
      # (its 30-min aggregation can't fit strict-greater-than cursor).
      - CURSOR_SCAN_ENABLED=true
      # OPT-0012: fast/slow tier split. Burst Open runs every 60s
      # (fast tier); Quick OC + Quick Profit stay on scan_interval_min
      # cadence (slow tier). Requires OPT-0011 — without cursor mode
      # the 60s polling would 10× MySQL load. Both tiers share
      # _scan_lock; collisions skip a tick (~1/10min, harmless).
      - BURST_FAST_TIER_ENABLED=true
    restart: unless-stopped
    depends_on:
      - redis-prod
    volumes:
      - ./backend/logs-prod:/app/logs
      - ./backend/logs_login_ip:/app/logs_login_ip
      - ./backend/data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  redis-prod:
    image: redis:7-alpine
    container_name: new-it-redis-prod
    restart: unless-stopped
    # 256MB cap + LRU eviction so a runaway cache writer can't OOM Redis
    # (default maxmemory=0 + noeviction would silently fail new SETs).
    # See docs/optimization/items/OPT-0019-redis-maxmemory-policy.md.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # OPT-0026: internal docs portal. MkDocs Material live-serves docs/ over
  # the shared compose network; Nginx proxies /docs/ to mkdocs:8000.
  # Read-only mounts so the container can never mutate source files.
  # Runtime ops: docs/operations/docs-portal.md
  mkdocs:
    image: squidfunk/mkdocs-material:latest
    container_name: new-it-mkdocs-prod
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    volumes:
      - ./docs:/docs/docs:ro
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
    restart: unless-stopped
